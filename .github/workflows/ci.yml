name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    env:
      MDH_CLIPBOARD_TESTS: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build MarkdownHelper.sln -c Release

      - name: Test
        run: dotnet test MarkdownHelper.sln -c Release --no-build --logger "console;verbosity=normal"
